[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentra-engine"
version = "0.0.0"
description = "Sentra engine package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk",
    "pydantic",
    "anyio",
    "pytest",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
