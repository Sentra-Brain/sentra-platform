name: Sentra API

on:
  push:
    branches: [main]
    paths:
      - 'services/sentra-api/**'
      - '.github/workflows/cicd-sentra-api.yml'
  pull_request:
    paths:
      - 'services/sentra-api/**'
      - '.github/workflows/cicd-sentra-api.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sentra-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 sentra_brain_api --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 sentra_brain_api --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: |
          pip install pytest
          pytest

  docker-build-and-push:
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sentra-api
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from requirements.txt
        id: get_version
        run: |
          echo "version=$(grep '^version=' requirements.txt | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/sentra-api:${{ steps.get_version.outputs.version }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/sentra-api:${{ steps.get_version.outputs.version }}

      - name: Tag and push 'latest'
        run: |
          docker tag ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/sentra-api:${{ steps.get_version.outputs.version }} \
            ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/sentra-api:latest
          docker push ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/sentra-api:latest
