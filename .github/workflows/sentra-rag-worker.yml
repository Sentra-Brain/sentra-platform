name: Sentra RAG Worker

on:
  push:
    branches: [main]
    paths:
      - 'services/sentra-rag-worker/**'
      - 'core/sentra-core/**'
      - '.github/workflows/cicd-sentra-rag-worker.yml'
  pull_request:
    paths:
      - 'services/sentra-rag-worker/**'
      - 'core/sentra-core/**'
      - '.github/workflows/cicd-sentra-rag-worker.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check-base-image-changes:
    runs-on: ubuntu-latest
    outputs:
      needs-rebuild: ${{ steps.check.outputs.needs-rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if requirements.rag.txt has changed
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "services/sentra-rag-worker/requirements.rag.txt"; then
            echo "needs-rebuild=true" >> $GITHUB_OUTPUT
            echo "requirements.rag.txt has changed, base image rebuild needed"
          else
            echo "needs-rebuild=false" >> $GITHUB_OUTPUT
            echo "requirements.rag.txt unchanged, checking if base image exists in ACR"
            # For now, we'll assume rebuild is needed if we can't verify image existence
            # In a real scenario, you might want to check ACR for image existence
            echo "needs-rebuild=true" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sentra-rag-worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pip install pytest
          pytest

  docker-build-and-push:
    if: github.ref == 'refs/heads/main'
    needs: [build-and-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sentra-rag-worker
    steps:
      - uses: actions/checkout@v4


      - name: Extract version from constants.py
        id: get_version
        run: |
          echo "version=$(grep -o 'VERSION = "[^"]*"' sentra_rag_worker/core/constants.py | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Docker login with ACR admin credentials
        run: echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -f services/sentra-rag-worker/Dockerfile \
            --build-arg BASE_IMAGE=${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/sentra-rag-base:latest \
            -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/sentra-rag-worker:${{ steps.get_version.outputs.version }} \
            .
        working-directory: .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/sentra-rag-worker:${{ steps.get_version.outputs.version }}

      - name: Tag and push 'latest'
        run: |
          docker tag ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/sentra-rag-worker:${{ steps.get_version.outputs.version }} \
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/sentra-rag-worker:latest
          docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/sentra-rag-worker:latest
