[project]
name = "sentra-engine"
version = "0.1.0"
description = "Streaming Conversation Engine for Sentra Brain (Fast/Planner modes, RAG-ready, multi-tool via MCP)"
authors = [{ name = "Juan G Carmona" }]
readme = "README.md"
requires-python = ">=3.9"

# Main dependencies
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "aiohttp>=3.9.0",          # async HTTP client for LLM/MCP/RAG calls
  "websockets>=12.0",        # optional streaming transport
  "async-timeout>=4.0.3",    # for time-bounded ops in tools/RAG
  "python-dateutil>=2.9.0",  # timestamps & scheduling in events
]

# Optional dependencies
[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "pytest-mock==3.14.1",
  "pytest-asyncio==1.1.0",
  "debugpy==1.8.15",
]

[tool.setuptools]
packages = ["sentra_engine"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
