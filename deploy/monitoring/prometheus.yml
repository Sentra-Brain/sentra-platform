global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Sentra API metrics
  - job_name: "sentra-api"
    static_configs:
      - targets: ["sentra-api:8080"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Sentra RAG Worker metrics
  - job_name: "sentra-rag-worker"
    static_configs:
      - targets: ["sentra-rag-worker:8080"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # RabbitMQ metrics
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # PostgreSQL metrics via postgres_exporter
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 15s

  # OpenTelemetry Collector metrics
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # Llama server health (if it exposes metrics)
  - job_name: "llama-server"
    static_configs:
      - targets: ["llama-server:11434"]
    metrics_path: "/health"
    scrape_interval: 30s