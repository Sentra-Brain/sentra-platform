services:
  sentra-web:
    build:
      context: ../apps/sentra-web    
    command: ["npm", "run", "dev:inspect"]
    image: sentra-web:dev
    container_name: sentra-web
    ports:
      - "3100:3100"   # App
      - "3129:9229"   # Node.js Inspect
    volumes:
      - ../apps/sentra-web:/app
      - /app/node_modules
    networks:
      - sentrabrain-dev-net
    env_file:
      - ../apps/sentra-web/.env

  sentra-admin:
    build:
      context: ../apps/sentra-admin 
    command: ["npm", "run", "dev:inspect"]
    image: sentra-admin:dev
    container_name: sentra-admin
    ports:
      - "3200:3200"   # App
      - "3229:9329"   # Node.js Inspect
    volumes:
      - ../apps/sentra-admin:/app
      - /app/node_modules
    networks:
      - sentrabrain-dev-net
    env_file:
      - ../apps/sentra-admin/.env

  sentra-api:
    build:
      context: ../
      dockerfile: services/sentra-api/Dockerfile
    image: sentra-api:dev
    container_name: sentra-api
    ports:
      - "8100:8100"
      - "5678:5678"
    volumes:
      - ../services/sentra-api:/app
      - ../libs/sentra-shared:/libs/sentra-shared
      - D:\sentra-knowledge:/mnt/sentra_knowledge:rw
    networks:
      - sentrabrain-dev-net
    env_file:
      - ../services/sentra-api/.env

  sentra-rag-worker:
    build:
      context: ../
      dockerfile: services/sentra-rag-worker/Dockerfile
    image: sentra-rag-worker:dev
    container_name: sentra-rag-worker
    pull_policy: always
    ports:
      - "5679:5679"   # Python debugpy
    volumes:
      - ../services/sentra-rag-worker:/app
      - ../libs/sentra-shared:/libs/sentra-shared
      - D:\sentra-knowledge:/mnt/sentra_knowledge:rw
      # - /opt/sentra-brain/knowledge:/mnt/sentra_knowledge:rw
    networks:
      - sentrabrain-dev-net
    env_file:
      - ../services/sentra-rag-worker/.env
    depends_on:
      - sentra-sql-db
      - sentra-vector-db
      - rabbitmq

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    ports:
      - "11434:11434"
    volumes:
      - D:\models:/models:ro
    # Uncomment the following line to use a specific model (small example model)
    # command: >
    #   -m /models/tiny-llama/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    #   --port 11434
    # --host 0.0.0.0
    command: >
      -m /models/capybara-mistral-7b/capybarahermes-2.5-mistral-7b.Q4_K_S.gguf
      --port 11434
      --host 0.0.0.0
    networks:
      - sentrabrain-dev-net
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia

  sentra-sql-db:
    image: postgres:16-alpine
    container_name: sentra-sql-db
    ports:
      - "5432:5432"
    volumes:
      - sentra-sql-data:/var/lib/postgresql/data
    networks:
      - sentrabrain-dev-net
    env_file:
      - .dev.env

  sentra-nosql-db:
    image: mongo:7
    container_name: sentra-nosql-db
    ports:
      - "27017:27017"
    volumes:
      - sentra-nosql-data:/data/db
    networks:
      - sentrabrain-dev-net
    env_file:
      - .dev.env

  sentra-vector-db:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: sentra-vector-db
    ports:
      - "8500:8001"
    volumes:
      - sentra-vector-data:/chroma/.chroma/index
    networks:
      - sentrabrain-dev-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Web UI
    environment:
      RABBITMQ_DEFAULT_USER: sentra
      RABBITMQ_DEFAULT_PASS: sentra
    networks:
      - sentrabrain-dev-net

volumes:
  sentra-sql-data:
  sentra-nosql-data:
  sentra-vector-data:

networks:
  sentrabrain-dev-net:
    driver: bridge
