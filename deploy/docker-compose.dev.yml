services:
  sentra-web:
    build:
      context: ../apps/sentra-web    
    command: ["npm", "run", "dev:inspect"]
    image: sentra-web:dev
    container_name: sentra-web
    ports:
      - "3100:3100"   # App
      - "3129:9229"   # Node.js Inspect
    volumes:
      - ../apps/sentra-web:/app
      - /app/node_modules
    networks:
      - sentrabrain-dev-net
    env_file:
      - ../apps/sentra-web/.env

  sentra-admin:
    build:
      context: ../apps/sentra-admin 
    command: ["npm", "run", "dev:inspect"]
    image: sentra-admin:dev
    container_name: sentra-admin
    ports:
      - "3200:3200"   # App
      - "3229:9329"   # Node.js Inspect
    volumes:
      - ../apps/sentra-admin:/app
      - /app/node_modules
    networks:
      - sentrabrain-dev-net
    env_file:
      - ../apps/sentra-admin/.env

  sentra-api:
    build:
      context: ../services/sentra-api
      dockerfile: Dockerfile
    image: sentra-api:dev
    container_name: sentra-api
    ports:
      - "8100:8100"   # API
      - "5678:5678"   # Python debugpy
    volumes:
      - ../services/sentra-api:/app
    networks:
      - sentrabrain-dev-net
    env_file:
      - ../services/sentra-api/.env

