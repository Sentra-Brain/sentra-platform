  #     - "8500:8001"
  #   volumes:
  #     - sentra-vector-data:/chroma/.chroma/index
  #   networks:
  #     - sentrabrain-dev-net

  sentra-sql-db:
    image: postgres:16-alpine
    container_name: sentra-sql-db
    ports:
      - "5432:5432"
    volumes:
      - sentra-sql-data:/var/lib/postgresql/data
    networks:
      - sentrabrain-dev-net
    env_file:
      - .dev.env

  sentra-nosql-db:
    image: mongo:7
    container_name: sentra-nosql-db
    ports:
      - "27017:27017"
    volumes:
      - sentra-nosql-data:/data/db
    networks:
      - sentrabrain-dev-net
    env_file:
      - .dev.env

volumes:
  sentra-sql-data:
  sentra-nosql-data:
  sentra-vector-data:

networks:
  sentrabrain-dev-net:
    driver: bridge
